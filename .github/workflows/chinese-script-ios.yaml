name: Chinese script iPad build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --fatal-warnings
      - run: flutter test --reporter expanded --timeout 2m
      - run: flutter build ios --release --no-codesign --dart-define=KAZUMI_PUBLIC_API=true
      - name: Package unsigned app for Sideloadly
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          find Payload/Runner.app/Frameworks -type d -name '*.framework' -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -q -r Kazumi_2.3.9_Traditional_no_sign.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kazumi-iPad-Traditional
          path: Kazumi_2.3.9_Traditional_no_sign.ipa
          retention-days: 14
